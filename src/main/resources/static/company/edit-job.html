
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job | HireHub</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
    <link rel="stylesheet" href="../css/company/edit-job.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <aside class="col-md-3 col-lg-2 sidebar p-3">
            <h4 class="mb-4">HireHub</h4>

            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Company Profile</a>
            <a href="create-job.html">Post a Job</a>
            <a href="jobs.html" class="active">Manage Jobs</a>
            <a href="applications.html">Applications</a>

            <hr>
            <a href="#" id="logoutBtn">Logout</a>
        </aside>

        <!-- Main Content -->
        <main class="col-md-9 col-lg-10 main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="page-title">Edit Job</h2>
                    <p class="text-muted">Update your job posting details.</p>
                </div>

                <a href="jobs.html" class="btn btn-outline-secondary">
                    Back to Jobs
                </a>
            </div>

            <div class="form-card">
                <div id="messageBox"></div>

                <form id="editJobForm">
                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label for="title" class="form-label">Job Title *</label>
                            <input type="text" id="title" class="form-control"
                                   required maxlength="150">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="location" class="form-label">Location *</label>
                            <input type="text" id="location" class="form-control"
                                   required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">
                            Job Description *
                        </label>
                        <textarea id="description" class="form-control"
                                  rows="6" required maxlength="2000"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="salaryMin" class="form-label">
                                Minimum Salary
                            </label>
                            <input type="number" id="salaryMin"
                                   class="form-control" min="0" step="0.01">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="salaryMax" class="form-label">
                                Maximum Salary
                            </label>
                            <input type="number" id="salaryMax"
                                   class="form-control" min="0" step="0.01">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="experienceRequired" class="form-label">
                                Experience (Years)
                            </label>
                            <input type="number" id="experienceRequired"
                                   class="form-control" min="0" step="1">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="employmentType" class="form-label">
                                Employment Type
                            </label>
                            <select id="employmentType" class="form-select">
                                <option value="">Select Type</option>
                                <option value="FULL_TIME">Full Time</option>
                                <option value="PART_TIME">Part Time</option>
                                <option value="CONTRACT">Contract</option>
                                <option value="INTERNSHIP">Internship</option>
                                <option value="REMOTE">Remote</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select id="status" class="form-select">
                                <option value="ACTIVE">Active</option>
                                <option value="INACTIVE">Inactive</option>
                                <option value="CLOSED">Closed</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="saveBtn">
                        Save Changes
                    </button>

                    <a href="jobs.html" class="btn btn-light border ms-2">
                        Cancel
                    </a>
                </form>
            </div>
        </main>
    </div>
</div>

<script src="../js/company/edit-job.js"></script>
</body>
</html>
