
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications | HireHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="../index.html">
            HireHub
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="jobs.html">Find Jobs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="profile.html">My Profile</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="my-application.html">
                        My Applications
                    </a>
                </li>
                <li class="nav-item">
                    <button class="btn btn-outline-danger ms-lg-2" id="logoutBtn">
                        Logout
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Page Header -->
<section class="container py-4">
    <h2 class="fw-bold mb-2">My Applications</h2>
    <p class="text-muted mb-0">
        Track the status of jobs you have applied for.
    </p>
</section>

<!-- Application Summary -->
<section class="container pb-4">
    <div class="row g-3">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <p class="text-muted mb-1">Total Applications</p>
                    <h3 class="fw-bold mb-0" id="totalApplications">0</h3>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <p class="text-muted mb-1">Pending</p>
                    <h3 class="fw-bold text-warning mb-0" id="pendingApplications">0</h3>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <p class="text-muted mb-1">Selected</p>
                    <h3 class="fw-bold text-success mb-0" id="selectedApplications">0</h3>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Applications List -->
<section class="container pb-5">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-2">Application History</h5>

                <select id="statusFilter" class="form-select w-auto">
                    <option value="ALL">All Statuses</option>
                    <option value="PENDING">Pending</option>
                    <option value="REVIEWED">Reviewed</option>
                    <option value="SHORTLISTED">Shortlisted</option>
                    <option value="INTERVIEW">Interview</option>
                    <option value="SELECTED">Selected</option>
                    <option value="REJECTED">Rejected</option>
                </select>
            </div>

            <div id="message"></div>
            <div id="applicationsContainer">
                <p class="text-muted">Loading applications...</p>
            </div>
        </div>
    </div>
</section>

<footer class="bg-dark text-white py-4">
    <div class="container text-center">
        <p class="mb-0">© 2026 HireHub. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/my-applications.js"></script>
</body>
</html>
