        </a>

                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">

<!-- Page Header -->
<section class="container py-4">
    <h2 class="fw-bold mb-2">My Candidate Profile</h2>
    <p class="text-muted mb-0">
        Keep your profile updated to improve your job opportunities.
    </p>
</section>

<!-- Profile Form -->
<section class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">

                    <div id="message"></div>

                    <form id="profileForm">
                        <div class="row g-3">

                            <div class="col-12">
                                <label for="profilePhoto" class="form-label">
                                    Profile Photo URL
                                </label>
                                <input type="url" class="form-control"
                                       id="profilePhoto"
                                       placeholder="https://example.com/photo.jpg">
                            </div>

                            <div class="col-md-6">
                                <label for="education" class="form-label">
                                    Education
                                </label>
                                <input type="text" class="form-control"
                                       id="education"
                                       placeholder="e.g. BCA, MCA"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label for="experience" class="form-label">
                                    Experience (Years)
                                </label>
                                <input type="number" class="form-control"
                                       id="experience"
                                       min="0"
                                       step="0.5"
                                       placeholder="e.g. 1"
                                       required>
                            </div>

                            <div class="col-12">
                                <label for="skills" class="form-label">
                                    Skills
                                </label>
                                <input type="text" class="form-control"
                                       id="skills"
                                       placeholder="Java, Spring Boot, MySQL, HTML, CSS"
                                       required>
                                <div class="form-text">
                                    Separate skills with commas.
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="expectedSalary" class="form-label">
                                    Expected Salary (Annual ₹)
                                </label>
                                <input type="number" class="form-control"
                                       id="expectedSalary"
                                       min="0"
                                       placeholder="e.g. 400000">
                            </div>

                            <div class="col-md-6">
                                <label for="location" class="form-label">
                                    Location
                                </label>
                                <input type="text" class="form-control"
                                       id="location"
                                       placeholder="e.g. Noida, Uttar Pradesh"
                                       required>
                            </div>

                            <div class="col-12">
                                <label for="bio" class="form-label">
                                    About Me
                                </label>
                                <textarea class="form-control"
                                          id="bio"
                                          rows="5"
                                          maxlength="1000"
                                          placeholder="Write a short introduction about yourself..."></textarea>
                            </div>

                            <div class="col-12 d-flex flex-wrap gap-2 mt-4">
                                <button type="submit" class="btn btn-primary"
                                        id="saveProfileBtn">
                                    Save Profile
                                </button>

                                <button type="reset" class="btn btn-outline-secondary">
                                    Reset
                                </button>
                            </div>

                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</section>

<footer class="bg-dark text-white py-4">
