
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs | HireHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="../index.html">
            HireHub
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="jobs.html">Find Jobs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="profile.html">My Profile</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="my-applications.html">
                        My Applications
                    </a>
                </li>
                <li class="nav-item">
                    <button class="btn btn-outline-danger ms-lg-2"
                            id="logoutBtn">
                        Logout
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Page Header -->
<section class="container py-4">
    <h2 class="fw-bold mb-2">Find Your Next Job</h2>
    <p class="text-muted">
        Explore opportunities and take the next step in your career.
    </p>
</section>

<!-- Search and Filters -->
<section class="container pb-4">
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form id="searchForm">
                <div class="row g-3">

                    <div class="col-md-5">
                        <label for="searchKeyword" class="form-label">
                            Job Title or Keyword
                        </label>
                        <input type="text" class="form-control"
                               id="searchKeyword"
                               placeholder="e.g. Java Developer">
                    </div>

                    <div class="col-md-4">
                        <label for="searchLocation" class="form-label">
                            Location
                        </label>
                        <input type="text" class="form-control"
                               id="searchLocation"
                               placeholder="e.g. Noida">
                    </div>

                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            Search Jobs
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </div>
</section>

<!-- Job Results -->
<section class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Available Jobs</h4>
        <span class="text-muted" id="jobCount">Loading jobs...</span>
    </div>

    <div id="message"></div>

    <div id="jobsContainer">
        <!-- Jobs will be loaded here using JavaScript -->
    </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-white py-4">
    <div class="container text-center">
        <p class="mb-0">© 2026 HireHub. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/candidate-jobs.js"></script>
</body>
</html>
