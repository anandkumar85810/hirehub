
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | HireHub</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="register-page">

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">
            HireHub
        </a>

        <a href="index.html" class="btn btn-outline-primary ms-auto">
            Home
        </a>
    </div>
</nav>

<section class="container register-container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card register-card border-0 shadow">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Create Account</h2>
                        <p class="text-muted">
                            Join HireHub and start your journey
                        </p>
                    </div>

                    <form id="registerForm">

                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Full Name
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="username"
                                   placeholder="Enter your full name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email Address
                            </label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   placeholder="Enter your email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">
                                Phone Number
                            </label>
                            <input type="tel"
                                   class="form-control"
                                   id="phone"
                                   placeholder="Enter your phone number"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   placeholder="Create a password"
                                   minlength="6"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="role" class="form-label">
                                Register As
                            </label>
                            <select class="form-select" id="role" required>
                                <option value="">Select account type</option>
                                <option value="CANDIDATE">Candidate</option>
                                <option value="COMPANY">Company</option>
                                <option value="RECRUITER">Recruiter</option>
                            </select>
                        </div>

                        <div id="registerMessage" class="mb-3"></div>

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Create Account
                        </button>

                    </form>

                    <p class="text-center mt-4 mb-0">
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/register.js"></script>
</body>
</html>
